apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8-deployement
  namespace: dev
  annotations:
      circleci.com/project-id: 852b87a9-f5bc-4c9c-8d96-850a0149da41
  labels:
      circleci.com/component-name: my-k8s-app
      circleci.com/version: 1.0.0
      app: my-k8s-app
spec:
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
        circleci.com/component-name: my-k8s-app
        circleci.com/version: 1.0.0
    spec:
      containers:
      - name: my-container
        image: krislamb21/my-k8s-app:latest
        ports:
        - containerPort: 3000